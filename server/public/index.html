<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пушики организации</title>
<style>
  :root { --bg: #fbf6ee; --card: #fffdf9; --line: #6b4423; --muted: #8a7563; --awake: #3f9b52; --dozing: #d49b2a; --asleep: #6a7bb5; --lost: #c4513b; --offline: #a99c90; --none: #e6dccf; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1f1a16; --card: #2a231d; --line: #e8d5bf; --muted: #b3a291; --none: #3a3129; } }
  body.board { --bg: #14110e; --card: #221c17; --line: #f1e3d0; --muted: #b3a291; --none: #3a3129; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--line); }
  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; padding: 16px 20px; border-bottom: 2px solid var(--line); }
  h1 { margin: 0; font-size: 20px; }
  .counts { display: flex; flex-wrap: wrap; gap: 8px; }
  .count, .btn { border: 2px solid var(--line); border-radius: 99px; padding: 4px 12px; background: var(--card); cursor: pointer; font: inherit; color: inherit; }
  .count[aria-pressed="true"] { background: var(--line); color: var(--bg); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .tools { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=search] { min-width: 310px; max-width: 100%; padding: 6px 10px; border: 2px solid var(--line); border-radius: 10px; background: var(--card); color: inherit; font: inherit; }
  main { padding: 4px 20px 16px; }
  section h2 { margin: 18px 0 8px; font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  section h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .cat { border: 2px solid var(--line); border-left-width: 8px; border-radius: 14px; padding: 12px 14px; background: var(--card); display: flex; flex-direction: column; gap: 4px; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .cat:hover, .cat:focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  .cat b { font-size: 16px; overflow-wrap: anywhere; }
  .sub { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .state { font-weight: 600; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { padding: 0 20px 16px; color: var(--muted); font-size: 12px; }

  dialog { border: 2px solid var(--line); border-radius: 16px; background: var(--card); color: var(--line); padding: 20px; width: min(640px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog h2 { margin: 0 0 2px; font-size: 20px; overflow-wrap: anywhere; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 14px 0; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .bar { display: flex; height: 22px; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--none); }
  .bar i { display: block; height: 100%; }
  .days { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin: 2px 0 12px; }
  .log { list-style: none; margin: 0; padding: 0; max-height: 200px; overflow: auto; font-size: 13px; }
  .log li { padding: 3px 0; border-top: 1px solid var(--none); display: flex; gap: 10px; }
  .log time { color: var(--muted); min-width: 96px; }
  #cfg { max-width: 760px; }
  #cfg h3 { margin: 14px 0 4px; font-size: 15px; }
  .diff { margin: 4px 0 8px; padding: 0; list-style: none; font-family: ui-monospace, monospace; font-size: 13px; }
  .diff .add { color: var(--awake); } .diff .del { color: var(--lost); } .diff .chg { color: var(--dozing); }
  .ver { border-top: 1px solid var(--none); padding: 6px 0; }
  code.cmd { display: block; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--none); padding: 6px 8px; border-radius: 8px; font-size: 12px; }
  body.board #cfg-open, body.board #me { display: none; }
  .row { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
  .danger { border-color: var(--lost); color: var(--lost); }

  /* табло для большого экрана: только счётчики и плитки */
  body.board header { border-bottom: 0; padding: 24px 28px 8px; }
  body.board h1 { font-size: 30px; }
  body.board #q, body.board footer { display: none; }
  body.board .counts { width: 100%; gap: 14px; }
  body.board .count { flex: 1 1 150px; border-radius: 16px; padding: 14px 18px; font-size: 18px; cursor: default; }
  body.board .count strong { display: block; font-size: 54px; line-height: 1.05; }
  body.board main { padding: 4px 28px 24px; }
  body.board section h2 { font-size: 20px; }
  body.board .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
  body.board .cat { padding: 8px 10px; cursor: default; }
  body.board .cat .extra { display: none; }
  #clock { display: none; font-size: 30px; font-variant-numeric: tabular-nums; }
  body.board #clock { display: block; }
</style>
</head>
<body>
<header>
  <h1>Пушики организации</h1>
  <div class="tools">
    <span id="clock"></span>
    <input type="search" id="q" placeholder="Поиск: компьютер, человек, отдел" aria-label="Поиск">
    <button type="button" class="btn" id="board">Табло</button>
    <button type="button" class="btn" id="cfg-open">Настройки и журнал</button>
    <span class="sub" id="me"></span>
  </div>
  <div class="counts" id="counts"></div>
</header>
<main id="list"><div class="empty">Загрузка…</div></main>
<footer id="foot"></footer>
<dialog id="card" aria-labelledby="card-title">
  <h2 id="card-title"></h2>
  <div class="sub" id="card-user"></div>
  <dl id="card-facts"></dl>
  <div class="sub">Последние 7 дней</div>
  <div class="bar" id="card-bar" role="img"></div>
  <div class="days" id="card-days"></div>
  <ul class="log" id="card-log"></ul>
  <div class="row">
    <button type="button" class="btn danger" id="card-forget">Забыть устройство</button>
    <button type="button" class="btn" id="card-close">Закрыть</button>
  </div>
</dialog>
<dialog id="cfg" aria-labelledby="cfg-title">
  <h2 id="cfg-title">Настройки с сервера</h2>
  <div class="sub">Каждая версия подписана ключом администратора. Откат — это та же настройка, подписанная заново с версией выше текущей: скачайте нужную версию и подпишите её командой ниже.</div>
  <div class="row" id="cfg-upload-row"><label class="btn">Выложить подписанный набор (bundle.json)<input type="file" id="cfg-upload" accept=".json,application/json" hidden></label><span class="sub" id="cfg-upload-msg"></span></div>
  <div id="cfg-list"></div>
  <h2>Журнал администраторов</h2>
  <ul class="log" id="cfg-log"></ul>
  <div class="row"><button type="button" class="btn" id="cfg-close">Закрыть</button></div>
</dialog>
<script src="app.js"></script>
</body>
</html>
