# TLS и ограничения перед сервером присутствия. Сертификат — от корпоративного УЦ: tls/server.crt, tls/server.key
limit_req_zone $binary_remote_addr zone=enroll:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=31536000" always;
  client_max_body_size 32k;
  server_tokens off;

  # админ-панель только из сети ИБ: впишите свои подсети
  location = /           { allow 10.0.0.0/8; deny all; proxy_pass http://server:8443; }
  location = /app.js     { allow 10.0.0.0/8; deny all; proxy_pass http://server:8443; }
  location /api/devices  { allow 10.0.0.0/8; deny all; proxy_pass http://server:8443; }
  location /api/configs  { allow 10.0.0.0/8; deny all; proxy_pass http://server:8443; }
  # GET — устройства забирают настройки; PUT — админ выкладывает, только из сети ИБ
  location = /api/config { limit_except GET { allow 10.0.0.0/8; deny all; } limit_req zone=api burst=20; proxy_pass http://server:8443; }

  location = /api/enroll { limit_req zone=enroll burst=10; proxy_pass http://server:8443; }
  location = /api/beat   { limit_req zone=api burst=20; proxy_pass http://server:8443; }
  location = /healthz    { proxy_pass http://server:8443; }
  location / { return 404; }
}
