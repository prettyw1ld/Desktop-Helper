# Единый вход в админ-панель через корпоративный OIDC (Keycloak, AD FS и т.п.). Запуск вместе с основным файлом:
#   docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d
# ADMIN_PASSWORD остаётся запасным входом напрямую в контейнер: через nginx при едином входе пароль не принимается.
# В .env дополнительно: OIDC_ISSUER, OIDC_CLIENT_ID, OIDC_CLIENT_SECRET, COOKIE_SECRET (32 байта base64),
# PUBLIC_URL (https://pushik.corp), PROXY_SECRET, ADMIN_VIEW_GROUPS, ADMIN_CONFIG_GROUPS. Подробно: docs/enterprise/server.md
services:
  server:
    environment:
      PROXY_SECRET: ${PROXY_SECRET:?PROXY_SECRET}
      ADMIN_VIEW_GROUPS: ${ADMIN_VIEW_GROUPS:-}
      ADMIN_CONFIG_GROUPS: ${ADMIN_CONFIG_GROUPS:?ADMIN_CONFIG_GROUPS}

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    restart: unless-stopped
    command:
      - --provider=oidc
      - --oidc-issuer-url=${OIDC_ISSUER:?OIDC_ISSUER}
      - --client-id=${OIDC_CLIENT_ID:?OIDC_CLIENT_ID}
      - --client-secret=${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET}
      - --cookie-secret=${COOKIE_SECRET:?COOKIE_SECRET}
      - --cookie-secure=true
      - --cookie-samesite=strict
      - --cookie-expire=8h
      - --redirect-url=${PUBLIC_URL:?PUBLIC_URL}/oauth2/callback
      - --email-domain=*
      - --oidc-groups-claim=groups
      - --scope=openid profile email groups
      - --set-xauthrequest=true
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
    networks: [front]

  nginx:
    depends_on: [server, oauth2-proxy]
    environment:
      PROXY_SECRET: ${PROXY_SECRET}
      NGINX_ENVSUBST_FILTER: ^PROXY_SECRET$
    volumes:
      # шаблон превращается в conf.d/pushik.conf, а обычный nginx.conf заменяется пустым файлом
      - ./nginx-sso.conf.template:/etc/nginx/templates/pushik.conf.template:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
